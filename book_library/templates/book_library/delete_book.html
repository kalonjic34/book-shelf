{% extends "book_library/base.html" %}

{% block content %}
    <div class="form-panel">
        <p class="eyebrow mb-2">Remove from your shelf</p>
        <h1 class="h2">Delete book?</h1>
        <p class="text-secondary mb-4">Are you sure you want to delete <strong>{{ book.title }}</strong>?</p>
        <form action="{% url "book_library:delete_book" book.id %}" method="post">
            {% csrf_token %}
            <button class="btn btn-danger me-2" name="submit">Yes, delete</button>
            <a class="btn btn-outline-secondary" href="{% url "book_library:genre" genre.id%}">Cancel</a>
        </form>
    </div>
{% endblock content %}
