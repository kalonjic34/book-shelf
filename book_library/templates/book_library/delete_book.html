{% extends "book_library/base.html" %}

{% block content %}
    <p>Delete book:</p>

    <form action="{% url "book_library:delete_book" book.id %}" method="post">
        {% csrf_token %}
        {{ form.as_div }}
        <p>Are you sure you want to delete: "{{book.title}}"?</p>
        <button name='submit'>Yes Delete</button>
        <a href="{% url "book_library:genre" genre.id%}">Cancel</a>


    </form>
{% endblock content %}
