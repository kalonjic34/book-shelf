{% extends "book_library/base.html" %}

{% block content %}
    <div class="form-panel">
        <p class="eyebrow mb-2">Organize your shelf</p>
        <h1 class="h2 mb-4">Add a new genre</h1>
        <form action="{% url "book_library:new_genre" %}" method="post">
            {% csrf_token %}
            {{ form.as_div }}
            <button class="btn btn-primary mt-3" name="submit">Add genre</button>
        </form>
    </div>
{% endblock content %}
