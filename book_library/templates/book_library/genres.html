{% extends "book_library/base.html" %}

{% block content %}
    <p>Genres:</p>

    <ul>
        {% for genre in genres %}
            <li>
                <a href="{% url "book_library:genre" genre.id %}">{{ genre.name }}</a>
            </li>
            {%empty%}
                <p>No genres have been added</p>
        {% endfor %}
    </ul>
    <a href="{% url "book_library:new_genre" %}">Add a new genre</a>
{% endblock content %}
